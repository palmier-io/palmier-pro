name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (Intel)
    # PalmierPro Intel local/BYOK edition. Trait-free x86_64 build on macOS 26.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SWIFT_TRIPLE: x86_64-apple-macosx26.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Show toolchain
        run: |
          swift --version
          uname -m

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-x86_64-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-x86_64-
            spm-${{ runner.os }}-

      - name: Check localization
        run: |
          localization_args=()
          if [[ "${{ github.event_name }}" == "pull_request" ]] &&
             ! git diff --quiet HEAD^1 HEAD -- \
               ':(glob)Sources/PalmierPro/Resources/Localization/*.lproj/*.strings' \
               ':(exclude,glob)Sources/PalmierPro/Resources/Localization/en.lproj/*.strings'; then
            localization_args+=(--require-complete)
          fi
          scripts/localization/sync.sh "${localization_args[@]}"
          git diff --exit-code -- Sources/PalmierPro/Resources/Localization/en.lproj/Localizable.strings

      - name: Test (Intel)
        run: swift test --triple "$SWIFT_TRIPLE"

      - name: Bundle Intel DMG
        run: scripts/bundle.sh release --intel --dmg

      - name: Upload PalmierPro-Intel.dmg
        uses: actions/upload-artifact@v4
        with:
          name: PalmierPro-Intel
          path: .build/PalmierPro-Intel.dmg
          if-no-files-found: error
